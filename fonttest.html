<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>글꼴 확인</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  body{margin:0;padding:20px 16px 40px;background:#f6e7e4;color:#4a2228;font:15px/1.6 sans-serif}
  h1{font-size:18px;margin:0 0 4px}
  .ua{font-size:11px;color:#7d5a5d;word-break:break-all;margin-bottom:16px}
  .row{background:#fbf3f0;border:1px solid #d9b9b6;padding:12px 14px;margin-bottom:10px}
  .name{font-size:12px;display:flex;justify-content:space-between;gap:8px}
  .ok{color:#2e7d32;font-weight:700}.no{color:#c62828;font-weight:700}
  .sample{font-size:26px;line-height:1.4;margin-top:6px}
  .ref{font-family:serif;font-size:26px;line-height:1.4;color:#b8606b}
</style>
</head>
<body>
<h1>글꼴 확인 페이지</h1>
<div class="ua" id="ua"></div>
<div id="list"></div>
<div class="row"><div class="name">비교용: 브라우저 기본 명조(serif)</div><div class="ref">Ji Young Lee 숫자로 7년</div></div>
<script>
const F=[['Homemade Apple','Ji Young Lee'],['Gowun Batang','숫자로 설득하고 7년'],['Noto Sans KR','브랜드의 문제를 정의합니다'],['Courier Prime','HOW I PLAN 2026'],['DM Serif Display','7년 40+ 2.3배']];
document.getElementById('ua').textContent=navigator.userAgent;
document.getElementById('list').innerHTML=F.map(([f,s],i)=>`<div class="row"><div class="name"><span>${f}</span><span id="s${i}">확인 중…</span></div><div class="sample" style="font-family:'${f}',monospace">${s}</div></div>`).join('');
(async()=>{
  for(let i=0;i<F.length;i++){
    let ok=false;
    try{const r=await document.fonts.load(`20px "${F[i][0]}"`,F[i][1]);ok=r.length>0&&document.fonts.check(`20px "${F[i][0]}"`,F[i][1])}catch(e){}
    const el=document.getElementById('s'+i);el.textContent=ok?'받아짐 ✓':'못 받음 ✗';el.className=ok?'ok':'no';
  }
})();
</script>
</body>
</html>
